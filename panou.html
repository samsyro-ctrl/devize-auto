<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>devize-auto</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Hanken+Grotesk:wght@400;500;600;650;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
  /* — Sistemul de design Build&Fix, acelasi ca in licitatie-analiza si mockup-ul aprobat — */
  :root {
    --orange-300:oklch(0.85 0.12 50); --orange-500:oklch(0.70 0.2393 38.12);
    --orange-soft:color-mix(in oklch, var(--orange-500) 16%, transparent);
    --warm-0:oklch(0.985 0.004 60); --warm-200:oklch(0.820 0.010 52);
    --warm-400:oklch(0.600 0.016 48); --warm-1000:oklch(0.0824 0.0271 38.12);
    --green-500:oklch(0.74 0.16 152); --amber-500:oklch(0.80 0.16 75); --red-500:oklch(0.63 0.22 25);
    --font-display:'Archivo','Arial Narrow',system-ui,sans-serif;
    --font-body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
    --font-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
    --glass:color-mix(in oklch, var(--warm-0) 6%, transparent);
    --glass-tare:color-mix(in oklch, var(--warm-0) 10%, transparent);
    --glass-inner:inset 0 1px 0 color-mix(in oklch, var(--warm-0) 18%, transparent),
                  inset 0 -1px 0 color-mix(in oklch, var(--warm-1000) 40%, transparent);
    --fundal:var(--warm-1000); --text:var(--warm-0);
    --slab:var(--warm-200); --sters:var(--warm-400);
    --linie:color-mix(in oklch, var(--warm-0) 14%, transparent);
    --linie2:color-mix(in oklch, var(--warm-0) 8%, transparent);
    --da:var(--green-500); --da-f:color-mix(in oklch, var(--green-500) 15%, transparent);
    --poate:var(--amber-500); --poate-f:color-mix(in oklch, var(--amber-500) 15%, transparent);
    --nu:var(--red-500); --nu-f:color-mix(in oklch, var(--red-500) 16%, transparent);
    --accent:var(--orange-500); --accent-f:var(--orange-soft);
    --firma:var(--orange-300); --firma-f:color-mix(in oklch, var(--orange-300) 13%, transparent);
    --chip:color-mix(in oklch, var(--warm-0) 9%, transparent);
  }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--fundal); color:var(--text); font-family:var(--font-body); }
  a { color:var(--accent); text-decoration:none; } a:hover { color:var(--orange-300); }
  .antet { max-width:1400px; margin:0 auto; padding:20px 22px 0; display:flex; justify-content:space-between; align-items:center; gap:16px; }
  .marca { display:flex; align-items:center; gap:10px; font-family:var(--font-display); font-weight:800; font-size:19px; cursor:pointer; }
  .marca .accent { color:var(--accent); }
  .meniu { max-width:1400px; margin:14px auto 0; padding:0 22px; display:flex; gap:2px; border-bottom:1px solid var(--linie2); align-items:center; }
  .meniu-i { padding:11px 16px; font-size:14px; font-weight:600; color:var(--sters); border-bottom:2px solid transparent; cursor:pointer; display:flex; align-items:center; gap:8px; }
  .meniu-i.activ { color:var(--text); border-color:var(--accent); }
  .meniu-proiect { margin-left:auto; font-size:13px; color:var(--sters); padding:0 4px 11px; }
  .meniu-proiect b { color:var(--text); font-weight:650; }
  /* Buton explicit de intoarcere la lista de proiecte -- separat de tabul de
     analiza, cu o culoare distincta (accent), ca sa nu se piarda in randul
     de taburi. Gasit real (17.09.2026, feedback Cristian): sigla singura,
     fara nicio eticheta, nu se citea ca o cale de navigare. */
  .meniu-i.buton-inapoi { color:var(--accent); }
  /* Meniu "Analiza" -- grupeaza cele 4 pagini secundare (Completitudine/
     Executie/Istoric/Cantitati), ca sa nu mai stea 7 taburi plate la un loc.
     Nu exista un tipar de dropdown-navigare gata in cod (verificat) --
     mecanica (position:relative/absolute + inchidere la click-in-afara) e
     noua, inspirata doar ca idee de la combo-ul de modele AI. */
  .meniu-analiza { position:relative; }
  .analiza-lista { position:absolute; top:calc(100% + 6px); left:0; z-index:30; min-width:200px;
    background:var(--warm-1000); border:1px solid var(--linie); border-radius:12px; box-shadow:0 10px 30px rgba(0,0,0,.5); padding:6px; }
  .analiza-optiune { padding:10px 12px; border-radius:8px; font-size:13.5px; font-weight:600; color:var(--sters); cursor:pointer; }
  .analiza-optiune:hover { background:var(--glass-tare); color:var(--text); }
  .analiza-optiune.activa { color:var(--accent); }
  main { max-width:1400px; margin:0 auto; padding:26px 22px 60px; }

  h1 { font-family:var(--font-display); font-size:24px; font-weight:800; margin:0 0 4px; letter-spacing:-.01em; }
  .sub { margin:0 0 24px; color:var(--sters); font-size:14px; }
  .titlu-pag { display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:20px; }

  .btn { padding:11px 18px; border:1px solid var(--linie); background:var(--glass); color:var(--text); border-radius:10px;
         font-size:14px; font-weight:650; font-family:inherit; display:inline-flex; align-items:center; gap:8px; cursor:pointer; }
  .btn.primar { background:var(--accent); color:var(--warm-1000); border:none; }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  label { display:block; font-size:13px; font-weight:650; color:var(--slab); margin-bottom:8px; }
  .camp { width:100%; padding:12px 14px; border:1px solid var(--linie); background:var(--glass); border-radius:10px;
          font-size:14.5px; font-family:inherit; color:var(--text); margin-bottom:20px; }
  .zona { border:2px dashed var(--linie); border-radius:14px; padding:34px 24px; text-align:center; background:var(--glass); cursor:pointer; }
  .zona.peste { border-color:var(--accent); background:var(--accent-f); }
  .zona svg { color:var(--sters); margin-bottom:12px; }
  .zona p { margin:0 0 4px; font-size:15px; font-weight:600; }
  .zona p.mic { margin:0; font-size:12.5px; color:var(--sters); font-weight:400; }
  .radiogrup { display:flex; gap:10px; margin-bottom:22px; }
  .radio-i { flex:1; border:1.5px solid var(--linie2); border-radius:12px; padding:14px 16px; cursor:pointer; }
  .radio-i.activ { border-color:var(--accent); background:var(--accent-f); }
  .radio-i b { display:block; font-size:14px; margin-bottom:3px; }
  .radio-i span { font-size:12px; color:var(--sters); }

  .card { background:var(--glass); border:1px solid var(--linie2); border-radius:16px; margin-bottom:11px;
          padding:18px 20px; display:flex; align-items:center; gap:18px; box-shadow:var(--glass-inner); cursor:pointer; }
  .card-nume { font-size:15.5px; font-weight:650; margin:0 0 5px; }
  .card-meta { font-size:12.5px; color:var(--sters); display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
  .stare { flex:0 0 auto; padding:5px 12px; border-radius:20px; font-size:12px; font-weight:650; }
  .stare.generat { background:var(--da-f); color:var(--da); }
  .stare.matching { background:var(--poate-f); color:var(--poate); }
  .stare.extras { background:var(--chip); color:var(--slab); }

  .tile { background:var(--glass); border:1px solid var(--linie2); border-radius:14px; padding:18px 16px; text-align:center; box-shadow:var(--glass-inner); }
  .tile b { display:block; font-family:var(--font-display); font-size:28px; font-weight:800; margin-bottom:4px; }
  .tile span { font-size:12px; color:var(--sters); font-weight:600; }
  .rezumat { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:12px; margin:20px 0; }

  .linie-card { background:var(--glass); border:1px solid var(--linie2); border-radius:16px; padding:18px 20px; margin-bottom:12px; box-shadow:var(--glass-inner); }
  .linie-denumire { font-size:16px; font-weight:700; margin:0 0 8px; }
  .linie-meta { display:flex; gap:14px; align-items:center; font-size:13px; color:var(--slab); margin-bottom:12px; flex-wrap:wrap; }
  .linie-meta b { color:var(--text); font-family:var(--font-mono); font-weight:600; }
  .capitol-chip { padding:3px 10px; border-radius:20px; background:var(--firma-f); color:var(--firma); font-size:11.5px; font-weight:650; }
  .avertisment { display:flex; gap:8px; align-items:flex-start; font-size:12.5px; color:var(--poate); margin-bottom:12px; background:var(--poate-f); padding:10px 12px; border-radius:10px; }

  .sugestie-ai { font-size:12.5px; color:var(--accent); margin-bottom:8px; font-weight:600; }
  .sugestie-negativa { color:var(--sters); font-weight:500; }
  .pret-istoric-lista { margin-top:8px; display:flex; flex-direction:column; gap:6px; }
  .pret-istoric-rand { display:flex; justify-content:space-between; gap:12px; font-size:12.5px; padding:8px 12px; background:var(--chip); border-radius:8px; }
  .pret-istoric-rand span { color:var(--slab); }
  .pret-istoric-rand b { font-family:var(--font-mono); white-space:nowrap; }
  .candidat { display:flex; align-items:center; gap:12px; padding:12px 14px; border:1.5px solid var(--linie2); border-radius:12px; margin-bottom:8px; cursor:pointer; }
  .candidat:hover { border-color:var(--accent); }
  .candidat-sugerat { border-color:var(--accent); background:var(--accent-f); }
  .candidat-info { flex:1; min-width:0; }
  .candidat-desc { font-size:13.5px; font-weight:600; margin:0 0 3px; }
  .candidat-cod { font-family:var(--font-mono); font-size:11px; color:var(--sters); }
  .candidat-um { flex:0 0 auto; font-size:11.5px; font-weight:650; padding:4px 9px; border-radius:8px; background:var(--chip); color:var(--slab); }

  .cauta-w { display:flex; gap:8px; margin:10px 0 12px; }
  .cauta-w input { flex:1; padding:10px 13px; border:1px solid var(--linie); background:var(--glass); border-radius:10px; font-size:13.5px; font-family:inherit; color:var(--text); }

  /* Combo box cautabil pentru alegerea modelului -- INLOCUIESTE <input list>
     + <datalist> nativ. Motivul: <datalist> arata doar un numar limitat de
     sugestii cand campul e gol/necompletat (comportament impus de browser,
     nu de noi) -- cu 400+ modele OpenRouter, omul vedea doar o mana de
     optiuni, niciodata lista intreaga, oricat de multe intrau in DOM.
     Raportat live, verificat: DATELE erau complete (436 modele, confirmate
     si direct de pe server), doar elementul nativ le arata trunchiat. */
  .model-combo { position:relative; flex:1; min-width:220px; }
  .model-lista { position:absolute; z-index:20; top:calc(100% + 4px); left:0; right:0; max-height:280px; overflow-y:auto;
    background:var(--warm-1000); border:1px solid var(--linie); border-radius:10px; box-shadow:0 10px 30px rgba(0,0,0,.5); }
  .model-optiune { padding:9px 13px; font-size:13px; cursor:pointer; display:flex; justify-content:space-between; gap:10px; align-items:baseline; }
  .model-optiune:hover, .model-optiune.activa { background:var(--glass-tare); }
  .model-optiune .m-id { font-family:var(--font-mono); font-size:12px; color:var(--text); }
  .model-optiune .m-nume { font-size:11.5px; color:var(--sters); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .model-lista .gol { padding:12px 13px; font-size:12.5px; color:var(--sters); text-align:center; }

  .lateral-titlu { font-size:12px; font-weight:700; color:var(--sters); text-transform:uppercase; letter-spacing:.04em; margin:22px 0 10px; }
  .rezolvat { display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:10px; opacity:.75; font-size:12.5px; }
  .rezolvat b { font-weight:600; color:var(--text); } .rezolvat span { color:var(--sters); font-family:var(--font-mono); font-size:10.5px; margin-left:6px; }

  .filtre { display:flex; gap:8px; margin-bottom:16px; }
  .filtru { padding:8px 16px; border-radius:20px; font-size:13px; font-weight:650; background:var(--chip); color:var(--sters); cursor:pointer; }
  .filtru.activ { background:var(--accent); color:var(--warm-1000); }
  .tabel-w { background:var(--glass); border:1px solid var(--linie2); border-radius:16px; overflow:auto; box-shadow:var(--glass-inner); }
  table { width:100%; border-collapse:collapse; }
  th { text-align:left; font-size:11px; font-weight:700; color:var(--sters); text-transform:uppercase; letter-spacing:.03em; padding:12px 16px; border-bottom:1px solid var(--linie2); white-space:nowrap; }
  th.num, td.num { text-align:right; }
  td { padding:11px 16px; border-bottom:1px solid var(--linie2); font-size:13.5px; }
  tr:last-child td { border-bottom:none; }
  .tip-tag { font-size:10px; font-weight:700; padding:3px 8px; border-radius:6px; text-transform:uppercase; }
  .tip-tag.t0 { background:color-mix(in oklch, var(--green-500) 15%, transparent); color:var(--green-500); }
  .tip-tag.t1 { background:var(--poate-f); color:var(--poate); }
  .tip-tag.t2 { background:var(--chip); color:var(--slab); }
  .tip-tag.t3 { background:color-mix(in oklch, var(--orange-500) 15%, transparent); color:var(--orange-500); }
  .cod { font-family:var(--font-mono); font-size:10.5px; color:var(--sters); display:block; margin-top:2px; }
  .pret-camp { width:90px; padding:6px 9px; border:1px solid var(--linie); background:var(--glass); border-radius:8px; font-family:var(--font-mono); font-size:13px; color:var(--text); text-align:right; }
  .pret-camp.gol { border-color:var(--poate); background:var(--poate-f); }

  .capitol { background:var(--glass); border:1px solid var(--linie2); border-radius:16px; margin-bottom:14px; overflow:hidden; box-shadow:var(--glass-inner); }
  .capitol-cap { padding:13px 18px; font-family:var(--font-display); font-weight:700; font-size:14px; background:var(--glass-tare); display:flex; justify-content:space-between; }
  .grid-deviz { display:grid; grid-template-columns:2fr 1fr; gap:22px; align-items:start; }
  .central { background:var(--glass); border:1px solid var(--linie2); border-radius:16px; padding:22px; box-shadow:var(--glass-inner); position:sticky; top:20px; }
  .central h3 { font-family:var(--font-display); font-size:15px; font-weight:800; margin:0 0 14px; }
  .rand { display:flex; justify-content:space-between; padding:7px 0; font-size:13px; border-bottom:1px solid var(--linie2); }
  .rand span:last-child { font-family:var(--font-mono); font-weight:600; }
  .rand.grup { border-top:1.5px solid var(--linie); margin-top:6px; padding-top:11px; }
  .rand.total { border:none; margin-top:8px; padding-top:12px; border-top:2px solid var(--accent); }
  .rand.total span:first-child { font-weight:700; }
  .rand.total span:last-child { font-size:18px; font-weight:800; color:var(--accent); font-family:var(--font-display); }
  .rand.finalcutva span:last-child { color:var(--da); font-size:20px; }

  .gol { text-align:center; padding:50px 20px; color:var(--sters); }
  .incarcare { text-align:center; padding:60px 20px; color:var(--sters); }
  .eroare-banda { background:var(--nu-f); color:var(--nu); padding:12px 16px; border-radius:10px; font-size:13.5px; margin-bottom:16px; }
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';

// ─── Stare + rutare (hash-based, gen "#/proiect/3/preturi") ─────────────────
let PROIECTE_CACHE = [];

function segmenteRuta() { return (location.hash.replace(/^#\/?/, '') || '').split('/').filter(Boolean); }
function navigheaza(ruta) { location.hash = ruta; }
window.addEventListener('hashchange', redeseneaza);

// Meniul "Analiza" din antet() -- deschis la click, inchis la click in
// afara lui. Definit O SINGURA DATA (nu per randare de pagina) -- antet()
// se re-genereaza la fiecare navigare, dar acest handler global ramane
// valabil neschimbat.
window.__toggleAnaliza = (e) => {
  e.stopPropagation();
  const lista = document.getElementById('analiza-lista');
  if (lista) lista.hidden = !lista.hidden;
};
document.addEventListener('click', (e) => {
  if (e.target.closest('.meniu-analiza')) return;
  const lista = document.getElementById('analiza-lista');
  if (lista) lista.hidden = true;
});

async function api(cale, optiuni) {
  const r = await fetch(cale, optiuni);
  const tip = r.headers.get('content-type') || '';
  const corp = tip.includes('application/json') ? await r.json() : null;
  if (!r.ok) throw new Error((corp && corp.eroare) || `Eroare server (${r.status})`);
  return corp;
}

/** Export deviz -- separat de api() fiindca raspunsul e ori un fisier binar
 * (200), ori JSON (409 blocat de completitudine/cantitati nerezolvate, cu
 * lista exacta -- vezi db.verificariBlocanteExport). Poarta obligatorie,
 * decizie Cristian 15.09.2026 -- inainte era doar avertisment vizual, usor
 * de ratat. Ocolire posibila (?forteaza=1), dar NICIODATA implicita -- cere
 * mereu confirmare explicita, cu lista reala afisata, nu o bifa ascunsa. */
async function exportaDeviz(proiectId, forteaza) {
  const url = `/api/proiecte/${proiectId}/export${forteaza ? '?forteaza=1' : ''}`;
  const r = await fetch(url);
  if (r.status === 409) {
    const corp = await r.json();
    const randC = (corp.blocatDeCompletitudine || []).map((v) => `  • [${v.stare}] ${v.activitate}${v.detaliu ? ' -- ' + v.detaliu : ''}`).join('\n');
    const randQ = (corp.blocatDeCantitati || []).map((v) => `  • [${v.stare}] ${v.activitate}${v.motiv ? ' -- ' + v.motiv : ''}`).join('\n');
    const mesaj = 'Devizul are verificări nerezolvate:\n\n'
      + (randC ? `Completitudine:\n${randC}\n\n` : '')
      + (randQ ? `Cantități:\n${randQ}\n\n` : '')
      + 'Exporți oricum? (recomandat: rezolvă-le întâi)';
    if (window.confirm(mesaj)) await exportaDeviz(proiectId, true);
    return;
  }
  if (!r.ok) {
    const corp = await r.json().catch(() => null);
    window.alert((corp && corp.eroare) || `Eroare server (${r.status})`);
    return;
  }
  const blob = await r.blob();
  const dispozitie = r.headers.get('content-disposition') || '';
  const m = /filename="?([^"]+)"?/.exec(dispozitie);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = m ? m[1] : `deviz-${proiectId}.xlsx`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(a.href);
}

const ic = (cale, marime) => `<svg width="${marime||18}" height="${marime||18}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-4px;flex:none">${cale}</svg>`;
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const banii = (n) => (Number(n) || 0).toLocaleString('ro-RO', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

const TABURI_ANALIZA = ['completitudine', 'executie', 'istoric', 'cantitati'];
function antet(tabActiv, proiectId, numeProiect) {
  const inAnaliza = TABURI_ANALIZA.includes(tabActiv);
  const taburi = proiectId ? `
    <div class="meniu-i buton-inapoi" onclick="navigheaza('/')">${ic('<path d="M19 12H5M12 19l-7-7 7-7"/>', 16)} Proiectele mele</div>
    <div class="meniu-i ${tabActiv==='revizuire'?'activ':''}" onclick="navigheaza('/proiect/${proiectId}/revizuire')">Revizuire</div>
    <div class="meniu-i ${tabActiv==='preturi'?'activ':''}" onclick="navigheaza('/proiect/${proiectId}/preturi')">Prețuire</div>
    <div class="meniu-i ${tabActiv==='deviz'?'activ':''}" onclick="navigheaza('/proiect/${proiectId}/deviz')">Deviz</div>
    <div class="meniu-i meniu-analiza ${inAnaliza?'activ':''}" onclick="window.__toggleAnaliza(event)">
      Analiză ${ic('<path d="M6 9l6 6 6-6"/>', 14)}
      <div class="analiza-lista" id="analiza-lista" hidden>
        <div class="analiza-optiune ${tabActiv==='completitudine'?'activa':''}" onclick="navigheaza('/proiect/${proiectId}/completitudine')">Completitudine</div>
        <div class="analiza-optiune ${tabActiv==='executie'?'activa':''}" onclick="navigheaza('/proiect/${proiectId}/executie')">Execuție</div>
        <div class="analiza-optiune ${tabActiv==='istoric'?'activa':''}" onclick="navigheaza('/proiect/${proiectId}/istoric')">Istoric prețuri</div>
        <div class="analiza-optiune ${tabActiv==='cantitati'?'activa':''}" onclick="navigheaza('/proiect/${proiectId}/cantitati')">Cantități PT</div>
      </div>
    </div>
    <div class="meniu-proiect">${esc(numeProiect||'')}</div>
  ` : `
    <div class="meniu-i ${tabActiv==='proiecte'?'activ':''}" onclick="navigheaza('/')">Proiecte</div>
    <div class="meniu-i ${tabActiv==='nou'?'activ':''}" onclick="navigheaza('/nou')">Proiect nou</div>
    <div class="meniu-i ${tabActiv==='setari'?'activ':''}" onclick="navigheaza('/setari')">Modele AI</div>
  `;
  return `
    <div class="antet">
      <div class="marca" onclick="navigheaza('/')">${ic('<path d="M9 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-4"/><path d="M14 3h7v7"/><path d="M10 14 21 3"/>', 24)}devize<span class="accent">-auto</span></div>
    </div>
    <div class="meniu">${taburi}</div>`;
}

function app(html) { document.getElementById('app').innerHTML = html; }

// ─── Pagina: proiect nou (upload) ────────────────────────────────────────────
function paginaProiectNou() {
  let fisierAles = null;
  let flux = 'liber';

  function randare(stareSpeciala) {
    app(antet('nou') + `
      <main style="max-width:720px">
        <h1>Proiect nou</h1>
        <p class="sub">Încarcă documentul cu lucrările — extragem automat liniile și le potrivim cu nomenclatorul.</p>

        <label>Nume proiect</label>
        <input class="camp" id="camp-nume" placeholder="ex. Reabilitare Școala Gimnazială Nr. 3">

        <label>Tip document</label>
        <div class="radiogrup">
          <div class="radio-i ${flux==='liber'?'activ':''}" onclick="window.__setFlux('liber')">
            <b>Antemăsurătoare liberă</b><span>Doar denumire + cantitate — aleg singur articolele din nomenclator</span>
          </div>
          <div class="radio-i ${flux==='impus'?'activ':''}" onclick="window.__setFlux('impus')">
            <b>Deviz deja structurat</b><span>Vine cu cod de nomenclator — respect codul dat, semnalez ce nu se leagă</span>
          </div>
        </div>

        <label>Document (Excel, PDF sau Word)</label>
        <div class="zona" id="zona-drop" onclick="document.getElementById('fisier-input').click()">
          ${ic('<path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a2 2 0 002 2h12a2 2 0 002-2v-3"/>', 30)}
          <p>${fisierAles ? esc(fisierAles.name) : 'Trage fișierul aici, sau apasă ca să alegi'}</p>
          <p class="mic">.xlsx · .pdf · .docx</p>
        </div>
        <input type="file" id="fisier-input" accept=".xlsx,.xls,.xlsm,.pdf,.docx" style="display:none">

        ${stareSpeciala === 'eroare' ? `<div class="eroare-banda" style="margin-top:16px">${esc(window.__eroareIncarcare || '')}</div>` : ''}
        ${stareSpeciala === 'incarcare' ? `<div class="incarcare">Se procesează — extragere text, apoi extragere linii (AI), apoi potrivire cu nomenclatorul. Poate dura până la un minut...</div>` : `
          <button class="btn primar" style="width:100%;justify-content:center;margin-top:22px" onclick="window.__trimiteIncarcare()">Încarcă și continuă ${ic('<path d="M5 12h14M13 6l6 6-6 6"/>')}</button>
        `}
      </main>`);

    const inputFisier = document.getElementById('fisier-input');
    inputFisier.onchange = () => { fisierAles = inputFisier.files[0] || null; randare(); };
    const zona = document.getElementById('zona-drop');
    zona.ondragover = (e) => { e.preventDefault(); zona.classList.add('peste'); };
    zona.ondragleave = () => zona.classList.remove('peste');
    zona.ondrop = (e) => { e.preventDefault(); zona.classList.remove('peste'); fisierAles = e.dataTransfer.files[0] || null; randare(); };
  }

  window.__setFlux = (f) => { flux = f; randare(); };
  window.__trimiteIncarcare = async () => {
    const nume = document.getElementById('camp-nume').value.trim();
    if (!nume) return alert('Scrie numele proiectului.');
    if (!fisierAles) return alert('Alege un fișier.');
    randare('incarcare');
    try {
      const q = new URLSearchParams({ nume: fisierAles.name, proiect: nume, flux });
      const rezultat = await api(`/api/proiecte?${q}`, { method: 'PUT', body: fisierAles });
      navigheaza(`/proiect/${rezultat.proiectId}/revizuire`);
    } catch (e) {
      window.__eroareIncarcare = e.message;
      randare('eroare');
    }
  };

  randare();
}

// ─── Pagina: revizuire (matching) ───────────────────────────────────────────
async function paginaRevizuire(proiectId) {
  app(antet('revizuire', proiectId) + `<main><div class="incarcare">Se încarcă...</div></main>`);
  let date;
  try { date = await api(`/api/proiecte/${proiectId}`); } catch (e) { return eroareGenerala(e); }
  const { proiect, linii } = date;
  // Pretul istoric se cere PER LINIE, la click (vezi window.__aratapret) --
  // NU la incarcarea paginii pt tot proiectul deodata. Gasit real
  // (17.09.2026): pe un proiect mare (3000+ linii), cautarea FTS insumata
  // pt toate liniile dura 37-74s -- ruta /referinte-istorice accepta acum
  // "?linieId=" tocmai pt asta (vezi panou.js). Cache simplu, per pagina,
  // ca un dublu-click sa nu mai refaca aceeasi cautare.
  const cachePretIstoric = new Map();

  const deRevizuit = linii.filter((l) => l.stare !== 'auto' && l.stare !== 'confirmat');
  const rezolvate = linii.filter((l) => l.stare === 'auto' || l.stare === 'confirmat');
  const faraPotrivire = linii.filter((l) => l.stare === 'fara_potrivire').length;

  function randCandidat(c, linieId, esteSugestie) {
    return `<div class="candidat${esteSugestie ? ' candidat-sugerat' : ''}" onclick="window.__confirma(${linieId}, '${esc(c.colectie)}', '${esc(c.cod)}')">
      <div class="candidat-info"><p class="candidat-desc">${esteSugestie ? '⭐ ' : ''}${esc(c.descriere)}</p><span class="candidat-cod">${esc(c.colectie)} / ${esc(c.cod)}</span></div>
      <span class="candidat-um">${esc(c.unitate||'')}</span>
    </div>`;
  }

  const liniiHtml = deRevizuit.map((l) => {
    const candidati = JSON.parse(l.candidati_json || '[]');
    // Sugestie AI (src/sugestieMatching.js) -- NICIODATA aplicata singura,
    // doar marcata (⭐, cu motiv) -- omul tot apasa cardul ca sa confirme,
    // exact ca la orice alt candidat.
    const areSugestie = l.sugestie_index !== null && l.sugestie_index !== undefined && candidati[l.sugestie_index];
    // "De ce?" -- sugestie_motiv exista si cand AI n-a gasit niciun candidat
    // potrivit (sugestie_index=null, vezi src/sugestieMatching.js) -- pana
    // acum motivul asta ramanea nefolosit in UI. Aratat distinct (neutru,
    // nu accent) fata de o sugestie reala, ca sa nu para o recomandare.
    const motivNegativ = !areSugestie && l.sugestie_motiv;
    return `<div class="linie-card" id="linie-${l.id}">
      <p class="linie-denumire">${esc(l.denumire)}</p>
      <div class="linie-meta">
        <span>Cantitate: <b>${l.cantitate} ${esc(l.unitate)}</b></span>
        <span class="capitol-chip">${esc(l.capitol)}</span>
        ${l.cod_dat ? `<span>Cod dat: <b>${esc(l.cod_dat)}</b></span>` : ''}
      </div>
      ${l.nota ? `<div class="avertisment">${ic('<path d="M12 9v4M12 17h.01"/><circle cx="12" cy="12" r="9"/>', 15)}${esc(l.nota)}</div>` : ''}
      ${areSugestie ? `<div class="sugestie-ai">⭐ Sugestie AI: ${esc(l.sugestie_motiv || '')}</div>` : ''}
      ${motivNegativ ? `<div class="sugestie-ai sugestie-negativa">🤖 AI n-a găsit niciun candidat potrivit: ${esc(l.sugestie_motiv)}</div>` : ''}
      ${candidati.length ? candidati.map((c, i) => randCandidat(c, l.id, areSugestie && i === l.sugestie_index)).join('') : '<p style="color:var(--sters);font-size:13px">Niciun candidat găsit automat.</p>'}
      <div class="cauta-w">
        <input placeholder="Caută alt articol în nomenclator..." onkeydown="if(event.key==='Enter') window.__cautaManual(${l.id}, this.value)">
        <button class="btn" onclick="window.__cautaManual(${l.id}, this.previousElementSibling.value)">Caută</button>
      </div>
      <div id="rezultate-cauta-${l.id}"></div>
      <button class="btn" onclick="window.__aratapret(${l.id})">${ic('<path d="M12 1v22M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/>', 14)} Preț istoric</button>
      <div id="pret-istoric-${l.id}" hidden class="pret-istoric-lista"></div>
    </div>`;
  }).join('');

  app(antet('revizuire', proiectId, proiect.nume) + `
    <main>
      <h1>Revizuire potriviri</h1>
      <p class="sub">${deRevizuit.length} de revizuit${faraPotrivire ? `, din care ${faraPotrivire} fără nicio potrivire` : ''} · ${rezolvate.length} deja rezolvate</p>

      ${deRevizuit.length ? liniiHtml : '<div class="gol">Nimic de revizuit — toate liniile sunt auto-potrivite sau confirmate.</div>'}

      ${rezolvate.length ? `
        <p class="lateral-titlu">Deja rezolvate (${rezolvate.length})</p>
        ${rezolvate.slice(0, 20).map((l) => `<div class="rezolvat">${ic('<path d="M5 13l4 4L19 7"/>', 15)}<b>${esc(l.denumire)}</b><span>${esc(l.colectie)} / ${esc(l.cod)}</span></div>`).join('')}
        ${rezolvate.length > 20 ? `<div style="text-align:center;padding:8px;font-size:12px;color:var(--sters)">... și încă ${rezolvate.length - 20}</div>` : ''}
      ` : ''}

      <div style="margin-top:24px;display:flex;justify-content:flex-end">
        <button class="btn primar" ${deRevizuit.length ? 'disabled' : ''} onclick="window.__genereaza(${proiectId})">
          Continuă la generare ${ic('<path d="M5 12h14M13 6l6 6-6 6"/>')}
        </button>
      </div>
    </main>`);

  window.__confirma = async (linieId, colectie, cod) => {
    try {
      await api(`/api/proiecte/${proiectId}/rezolutie`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ linieId, colectie, cod }) });
      paginaRevizuire(proiectId);
    } catch (e) { alert(e.message); }
  };

  // Fetch LA CLICK, per linie (nu la incarcarea paginii pt tot proiectul --
  // vezi comentariul de mai sus, gasit real ca dura 37-74s pe un proiect
  // mare). Cache simplu in cachePretIstoric, ca un al doilea click sa nu
  // mai refaca aceeasi cautare.
  window.__aratapret = async (linieId) => {
    const el = document.getElementById(`pret-istoric-${linieId}`);
    if (!el) return;
    if (!el.hidden) { el.hidden = true; return; }
    el.hidden = false;
    if (cachePretIstoric.has(linieId)) { el.innerHTML = cachePretIstoric.get(linieId); return; }
    el.innerHTML = '<p style="font-size:12px;color:var(--sters);margin:8px 0">Se caută...</p>';
    try {
      const { rezultate } = await api(`/api/proiecte/${proiectId}/referinte-istorice?linieId=${linieId}`);
      const referinte = rezultate[0]?.referinte || [];
      const html = referinte.length
        ? referinte.map((r) => `<div class="pret-istoric-rand">
            <span>${esc(r.proiect)}${r.cod ? ` · ${esc(r.cod)}` : ''} — ${esc(r.denumire)}</span>
            <b>${banii(r.pret_unitar)} lei/${esc(r.unitate || '')}</b>
          </div>`).join('')
        : '<p style="font-size:12px;color:var(--sters);margin:8px 0">Niciun preț istoric găsit pentru această linie.</p>';
      cachePretIstoric.set(linieId, html);
      el.innerHTML = html;
    } catch (e) { el.innerHTML = `<p style="font-size:12px;color:var(--nu)">${esc(e.message)}</p>`; }
  };

  window.__cautaManual = async (linieId, text) => {
    const container = document.getElementById(`rezultate-cauta-${linieId}`);
    if (!text || !text.trim()) { container.innerHTML = ''; return; }
    container.innerHTML = '<p style="font-size:12px;color:var(--sters);margin:8px 0">Se caută...</p>';
    try {
      const rezultate = await api(`/api/cauta?q=${encodeURIComponent(text)}`);
      container.innerHTML = rezultate.length
        ? rezultate.map((c) => randCandidat(c, linieId)).join('')
        : '<p style="font-size:12px;color:var(--sters);margin:8px 0">Niciun rezultat.</p>';
    } catch (e) { container.innerHTML = `<p style="font-size:12px;color:var(--nu)">${esc(e.message)}</p>`; }
  };

  window.__genereaza = async (id) => {
    try {
      const r = await api(`/api/proiecte/${id}/genereaza`, { method: 'POST' });
      navigheaza(`/proiect/${id}/preturi`);
    } catch (e) { alert(e.message); }
  };
}

// ─── Pagina: pretuire ────────────────────────────────────────────────────────
async function paginaPreturi(proiectId) {
  app(antet('preturi', proiectId) + `<main><div class="incarcare">Se încarcă...</div></main>`);
  let proiect, resurse;
  try {
    proiect = (await api(`/api/proiecte/${proiectId}`)).proiect;
    resurse = await api(`/api/proiecte/${proiectId}/resurse`);
  } catch (e) { return eroareGenerala(e); }

  if (!resurse.length) {
    return app(antet('preturi', proiectId, proiect.nume) + `<main><div class="gol">Nicio resursă generată încă.<br><br><button class="btn primar" onclick="navigheaza('/proiect/${proiectId}/revizuire')">Înapoi la revizuire</button></div></main>`);
  }

  const ETICHETA_TIP = { 0: ['t0', 'Transport'], 1: ['t1', 'Manoperă'], 2: ['t2', 'Utilaj'], 3: ['t3', 'Material'] };
  let filtruActiv = 'toate';

  function randare() {
    const vizibile = filtruActiv === 'toate' ? resurse : resurse.filter((r) => r.tip === filtruActiv);
    const faraPret = resurse.filter((r) => !r.pret_curent).length;

    const randuri = vizibile.map((r) => {
      const [clasa, eticheta] = ETICHETA_TIP[r.tip] || ['t2', '?'];
      const valoare = r.pret_curent ? r.cantitate_totala * r.pret_curent : null;
      return `<tr>
        <td><span style="font-weight:600">${esc(r.descriere)}</span><span class="cod">${esc(r.colectie)} / ${esc(r.cod)}</span></td>
        <td><span class="tip-tag ${clasa}">${eticheta}</span></td>
        <td class="num">${Number(r.cantitate_totala).toLocaleString('ro-RO',{maximumFractionDigits:3})} ${esc(r.unitate||'')}</td>
        <td class="num"><input class="pret-camp ${r.pret_curent?'':'gol'}" value="${r.pret_curent||''}" placeholder="—"
              onchange="window.__salveazaPret('${esc(r.colectie)}','${esc(r.cod)}', this.value)"></td>
        <td class="num">${valoare != null ? banii(valoare) + ' lei' : '—'}</td>
      </tr>`;
    }).join('');

    app(antet('preturi', proiectId, proiect.nume) + `
      <main>
        <div class="titlu-pag"><div><h1>Prețuire resurse</h1><p class="sub" style="margin:0">${resurse.length} resurse agregate · prețurile din cache se completează automat</p></div></div>
        <div class="filtre">
          <div class="filtru ${filtruActiv==='toate'?'activ':''}" onclick="window.__filtreaza('toate')">Toate (${resurse.length})</div>
          <div class="filtru ${filtruActiv===3?'activ':''}" onclick="window.__filtreaza(3)">Materiale (${resurse.filter(r=>r.tip===3).length})</div>
          <div class="filtru ${filtruActiv===1?'activ':''}" onclick="window.__filtreaza(1)">Manoperă (${resurse.filter(r=>r.tip===1).length})</div>
          <div class="filtru ${filtruActiv===2?'activ':''}" onclick="window.__filtreaza(2)">Utilaj (${resurse.filter(r=>r.tip===2).length})</div>
          <div class="filtru ${filtruActiv===0?'activ':''}" onclick="window.__filtreaza(0)">Transport (${resurse.filter(r=>r.tip===0).length})</div>
        </div>
        <div class="tabel-w"><table>
          <tr><th>Resursă</th><th>Tip</th><th class="num">Cantitate</th><th class="num">Preț unitar</th><th class="num">Valoare</th></tr>
          ${randuri}
        </table></div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:18px">
          <div style="font-size:13px;color:${faraPret?'var(--poate)':'var(--sters)'}">${faraPret ? `${faraPret} resurse fără preț — devizul nu se poate genera până le completezi` : 'Toate resursele au preț.'}</div>
          <div style="display:flex;gap:10px">
            <button class="btn" id="btn-rfq" onclick="window.__trimiteRfq()">Trimite necesarul spre ofertare (RFQ)</button>
            <button class="btn primar" onclick="navigheaza('/proiect/${proiectId}/deviz')">Continuă la deviz ${ic('<path d="M5 12h14M13 6l6 6-6 6"/>')}</button>
          </div>
        </div>
      </main>`);
  }

  window.__filtreaza = (t) => { filtruActiv = t; randare(); };
  window.__salveazaPret = async (colectie, cod, val) => {
    const pret = Number(String(val).replace(',', '.'));
    if (!Number.isFinite(pret) || pret <= 0) return;
    try {
      await api('/api/pret', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ colectie, cod, pret, proiectId }) });
      const r = resurse.find((x) => x.colectie === colectie && x.cod === cod);
      if (r) r.pret_curent = pret;
      randare();
    } catch (e) { alert(e.message); }
  };
  // RFQ real, prin Core API -> recrutare-bot (vezi src/rfq.js) -- fire-and-forget
  // pe partea de recrutare-bot (raspunde imediat, rezultatul apare acolo, in
  // Administrare > Istoric, dupa 2-4 minute). Nu e fail-open: o eroare aici
  // TREBUIE sa ajunga la om, altfel ar crede ca s-a trimis cand nu s-a trimis.
  window.__trimiteRfq = async () => {
    const buton = document.getElementById('btn-rfq');
    buton.disabled = true; buton.textContent = 'Trimit...';
    try {
      const r = await api(`/api/proiecte/${proiectId}/rfq`, { method: 'POST' });
      alert(r.mesaj || 'Trimis.');
    } catch (e) { alert('N-am putut trimite: ' + e.message); }
    finally { buton.disabled = false; buton.textContent = 'Trimite necesarul spre ofertare (RFQ)'; }
  };

  randare();
}

// ─── Pagina: deviz final ─────────────────────────────────────────────────────
async function paginaDeviz(proiectId) {
  app(antet('deviz', proiectId) + `<main><div class="incarcare">Se încarcă...</div></main>`);
  let proiect;
  try { proiect = (await api(`/api/proiecte/${proiectId}`)).proiect; } catch (e) { return eroareGenerala(e); }

  let rezultat;
  try {
    rezultat = await api(`/api/proiecte/${proiectId}/deviz`);
  } catch (e) {
    return app(antet('deviz', proiectId, proiect.nume) + `<main>
      <h1>Deviz final</h1>
      <div class="eroare-banda">${esc(e.message)}</div>
      <button class="btn primar" onclick="navigheaza('/proiect/${proiectId}/preturi')">Înapoi la prețuire</button>
    </main>`);
  }

  const { capitole, centralizator: c, avertismente } = rezultat;
  const capitoleHtml = capitole.map((cap) => `
    <div class="capitol">
      <div class="capitol-cap"><span>${esc(cap.nume)}</span><span>${banii(cap.total)} lei</span></div>
      <table>
        <tr><th>Denumire</th><th class="num">Cant.</th><th class="num">Materiale</th><th class="num">Manoperă</th><th class="num">Utilaj</th><th class="num">Transport</th><th class="num">Total</th></tr>
        ${cap.linii.map((l) => `<tr>
          <td>${esc(l.denumire)}</td><td class="num">${l.cantitate} ${esc(l.unitate)}</td>
          <td class="num">${banii(l.materiale)}</td><td class="num">${banii(l.manopera)}</td><td class="num">${banii(l.utilaj)}</td><td class="num">${banii(l.transport)}</td><td class="num">${banii(l.total)}</td>
        </tr>`).join('')}
      </table>
    </div>`).join('');

  app(antet('deviz', proiectId, proiect.nume) + `
    <main>
      <div class="titlu-pag">
        <div><h1>Deviz final</h1><p class="sub" style="margin:0">${capitole.reduce((s,cp)=>s+cp.linii.length,0)} linii, ${capitole.length} capitole</p></div>
        <button class="btn primar" onclick="exportaDeviz(${proiectId})">${ic('<path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a2 2 0 002 2h12a2 2 0 002-2v-3"/>')} Exportă Excel</button>
      </div>
      ${avertismente && avertismente.length ? `<div class="eroare-banda" style="background:var(--poate-f);color:var(--poate)">${avertismente.length} avertismente la descompunere -- vezi consola serverului.</div>` : ''}
      <div class="grid-deviz">
        <div>${capitoleHtml}</div>

  } catch (e) { return eroareGenerala(e); }

  function randare(stareSpeciala) {
    if (!date.areScop) {
      app(antet('completitudine', proiectId, proiect.nume) + `
        <main><h1>Completitudine</h1>
        <div class="gol">Proiectul n-are scop extras din documentație (produs/nivel de livrare/activități) --
        rulează "importa-licitatie" sau completează manual proiecte.scop_json.</div></main>`);

        <div class="titlu-pag">

          <button class="btn primar" ${stareSpeciala==='ruleaza'?'disabled':''} onclick="window.__ruleazaCompletitudine()">
            ${stareSpeciala==='ruleaza' ? 'Se verifică...' : (v.length ? 'Rulează din nou' : 'Rulează verificarea')}
          </button>
        </div>
        ${stareSpeciala==='eroare' ? `<div class="eroare-banda">${esc(window.__eroareCompletitudine||'')}</div>` : ''}
        ${!v.length && stareSpeciala!=='ruleaza' ? `<div class="gol">Nicio verificare rulată încă -- apasă "Rulează verificarea" (cost real, un apel AI).</div>` : ''}
        ${v.length ? `
          <div class="rezumat">
            <div class="tile"><b>${acoperite}</b><span>Acoperite</span></div>
            <div class="tile"><b>${partiale.length}</b><span>Parțiale</span></div>
            <div class="tile"><b>${lipsa.length}</b><span>Lipsă</span></div>
          </div>
          ${lipsa.length ? `<p class="lateral-titlu">Lipsă din deviz</p>${lipsa.map((x) => `
            <div class="linie-card"><p class="linie-denumire">${esc(x.activitate)}</p>
            <div class="avertisment">${ic('<path d="M12 9v4M12 17h.01"/><circle cx="12" cy="12" r="9"/>', 15)}${esc(x.detaliu||'')}</div></div>`).join('')}` : ''}
          ${partiale.length ? `<p class="lateral-titlu">Parțiale</p>${partiale.map((x) => `
            <div class="linie-card"><p class="linie-denumire">${esc(x.activitate)}</p>
            <p class="sub" style="margin:0">${esc(x.detaliu||'')}</p></div>`).join('')}` : ''}
        ` : ''}
      </main>`);
  }

  window.__ruleazaCompletitudine = async () => {
    randare('ruleaza');
    try {
      const r = await api(`/api/proiecte/${proiectId}/completitudine`, { method: 'POST' });
      date = { ...date, verificari: r.verificari, produs: r.produs, nivelLivrare: r.nivel_livrare };
      randare();
    } catch (e) {
      window.__eroareCompletitudine = e.message;
      randare('eroare');
    }
  };

  randare();
}

// ─── Pagina: verificare cantitati (Robot A/B/C/D, Proiect Tehnic) ──────────
// 2 pasi, cu poarta de cost explicita pt Robotul B (vedere) -- port pe web al
// fluxului readline din CLI (verifica-cantitati-pt), acelasi principiu:
// Robot A + esantionul Robotului B ruleaza fara gate (cost modest), DAR restul
// paginilor Robotului B cere o alegere explicita a omului, cu costul real
// aratat (nu inventat -- vine dintr-o pagina-esantion chiar procesata).
function randComparatiiCantitati(comparatii, avertismente) {
  const suf = comparatii.filter((c) => c.stare === 'suficienta');
  const insuf = comparatii.filter((c) => c.stare === 'insuficienta');
  const fara = comparatii.filter((c) => c.stare === 'fara_corespondent');
  return `
    <div class="rezumat">
      <div class="tile"><b>${suf.length}</b><span>Suficiente</span></div>
      <div class="tile"><b>${insuf.length}</b><span>Insuficiente</span></div>
      <div class="tile"><b>${fara.length}</b><span>Fără corespondent</span></div>
    </div>
    ${insuf.length ? `<p class="lateral-titlu">Cantitate insuficientă</p>${insuf.map((c) => `
      <div class="linie-card"><p class="linie-denumire">${esc(c.activitate)}</p>
      <div class="avertisment">${ic('<path d="M12 9v4M12 17h.01"/><circle cx="12" cy="12" r="9"/>', 15)}
      țintă ${c.cantitateTinta} ${esc(c.unitateTinta)}, în deviz ${c.cantitateDeviz} -- ${esc(c.motiv || '')}</div></div>`).join('')}` : ''}
    ${fara.length ? `<p class="lateral-titlu">Fără corespondent în deviz</p>${fara.map((c) => `
      <div class="linie-card"><p class="linie-denumire">${esc(c.activitate)}</p>
      <p class="sub" style="margin:0">țintă ${c.cantitateTinta} ${esc(c.unitateTinta)}${c.motiv ? ' -- ' + esc(c.motiv) : ''}</p></div>`).join('')}` : ''}
    ${avertismente && avertismente.length ? avertismente.map((a) => `<div class="eroare-banda" style="background:var(--poate-f);color:var(--poate)">${esc(a)}</div>`).join('') : ''}
  `;
}

async function paginaCantitati(proiectId) {
  app(antet('cantitati', proiectId) + `<main><div class="incarcare">Se încarcă...</div></main>`);
  let proiect, salvate;
  try {
    proiect = (await api(`/api/proiecte/${proiectId}`)).proiect;
    salvate = await api(`/api/proiecte/${proiectId}/cantitati-pt`);
  } catch (e) { return eroareGenerala(e); }

  let estimare = null;

  function randare(stareSpeciala) {
    const comparatiiSalvate = (salvate.verificari || []).map((v) => ({
      activitate: v.activitate, cantitateTinta: v.cantitate_tinta, unitateTinta: v.unitate_tinta,
      stare: v.stare, cantitateDeviz: v.cantitate_deviz, motiv: v.motiv,
    }));

    app(antet('cantitati', proiectId, proiect.nume) + `
      <main>
        <div class="titlu-pag">
          <div><h1>Cantități (Proiect Tehnic)</h1><p class="sub" style="margin:0">Compară cantitățile din deviz cu ce a calculat/desenat proiectantul</p></div>
          ${!estimare ? `<button class="btn primar" ${stareSpeciala==='estimeaza'?'disabled':''} onclick="window.__estimeazaCant()">${stareSpeciala==='estimeaza' ? 'Analizez...' : (comparatiiSalvate.length ? 'Rulează din nou' : 'Rulează analiza')}</button>` : ''}
        </div>
        ${stareSpeciala==='eroare' ? `<div class="eroare-banda">${esc(window.__eroareCantitati||'')}</div>` : ''}
        ${!estimare && !comparatiiSalvate.length && stareSpeciala!=='estimeaza' ? '<div class="gol">Nicio verificare rulată încă -- apasă "Rulează analiza" (cost real: Robot A + un eșantion din Robot B).</div>' : ''}

        ${estimare ? `
          <div class="linie-card">
            <p class="linie-denumire">Robot A: ${estimare.cantitatiGasiteText} cantități găsite din piese scrise.</p>
            ${estimare.paginiTotale ? `
              <p class="sub" style="margin:6px 0 0">Robot B (vedere, piese desenate) -- eșantion testat: cost real $${estimare.costEsantion ?? '?'}.
              Total de procesat: ${estimare.paginiTotale} pagini${estimare.costEstimatTotal!=null?` -- estimat ~$${estimare.costEstimatTotal}`:' (estimat indisponibil)'}.</p>
              <div style="display:flex;gap:10px;margin-top:14px">
                <button class="btn primar" ${stareSpeciala==='finalizeaza'?'disabled':''} onclick="window.__finalizeazaCant(true)">Continuă analiza completă${estimare.costEstimatTotal!=null?` (~$${estimare.costEstimatTotal})`:''}</button>
                <button class="btn" ${stareSpeciala==='finalizeaza'?'disabled':''} onclick="window.__finalizeazaCant(false)">Analizează doar cu eșantionul</button>
              </div>
            ` : `
              <p class="sub" style="margin:6px 0 0">Niciun document cu piese desenate găsit.</p>
              <button class="btn primar" style="margin-top:14px" ${stareSpeciala==='finalizeaza'?'disabled':''} onclick="window.__finalizeazaCant(false)">Continuă (compară cu devizul)</button>
            `}
          </div>
        ` : ''}

        ${comparatiiSalvate.length && !estimare ? randComparatiiCantitati(comparatiiSalvate, []) : ''}
      </main>`);
  }

  window.__estimeazaCant = async () => {
    randare('estimeaza');
    try {
      estimare = await api(`/api/proiecte/${proiectId}/cantitati-pt/estimare`, { method: 'POST' });
      randare();
    } catch (e) { window.__eroareCantitati = e.message; estimare = null; randare('eroare'); }
  };

  window.__finalizeazaCant = async (ruleazaRobotB) => {
    randare('finalizeaza');
    try {
      const r = await api(`/api/proiecte/${proiectId}/cantitati-pt/finalizeaza`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ruleazaRobotB }),
      });
      estimare = null;
      app(antet('cantitati', proiectId, proiect.nume) + `<main><h1>Cantități (Proiect Tehnic)</h1>${randComparatiiCantitati(r.comparatii, r.avertismente)}</main>`);
    } catch (e) { window.__eroareCantitati = e.message; randare('eroare'); }
  };

  randare();
}

// ─── Pagina: setari (model per task + preturi furnizori castigatoare) ──────
// Doua tab-uri, ca la Administrare din public.html: "Modele AI" (continutul
// de baza, neschimbat) si "Prețuri furnizori" (doar referinta, citita din
// BFLA -- vezi discutia despre lipsa legaturii automate la colectie/cod).
let ADMIN_TAB = 'modele';
async function paginaSetari() {
  app(antet('setari') + `<main><div class="incarcare">Se încarcă...</div></main>`);
  let roluri = [], catalog = [], preturiFurnizori = [];
  if (ADMIN_TAB === 'modele') {
    try {
      const [rSetari, rCatalog] = await Promise.all([api('/api/setari-model'), api('/api/modele-openrouter')]);
      roluri = rSetari.roluri || [];
      catalog = rCatalog.modele || [];
    } catch (e) { return eroareGenerala(e); }
  } else {
    try {
      const r = await api('/api/preturi-castigatoare');
      preturiFurnizori = r.preturi || [];
    } catch (e) { return eroareGenerala(e); }
  }

  function randRol(rol) {
    return `<div class="linie-card">
      <p class="linie-denumire">${esc(rol.eticheta)}</p>
      <div class="linie-meta">
        <span>${rol.suprascris ? 'Suprascris' : 'Implicit din .env'} — <b>${esc(rol.modelActiv)}</b></span>
      </div>
      <div class="cauta-w">
        <div class="model-combo">
          <input class="camp" style="margin-bottom:0" autocomplete="off" value="${esc(rol.modelActiv)}" data-rol="${esc(rol.rol)}">
          <div class="model-lista" data-rol="${esc(rol.rol)}" hidden></div>
        </div>
        <button class="btn primar btn-salveaza" data-rol="${esc(rol.rol)}">Salvează</button>
        ${rol.suprascris ? `<button class="btn btn-implicit" data-rol="${esc(rol.rol)}">Revino la implicit</button>` : ''}
      </div>
    </div>`;
  }

  function randCandidatFurnizor(c, index) {
    return `<div class="candidat" onclick="window.__aplicaLaCod(${index}, '${esc(c.colectie)}', '${esc(c.cod)}')">
      <div class="candidat-info"><p class="candidat-desc">${esc(c.descriere)}</p><span class="candidat-cod">${esc(c.colectie)} / ${esc(c.cod)}</span></div>
      <span class="candidat-um">${esc(c.unitate||'')}</span>
    </div>`;
  }

  function randPretFurnizor(p, index) {
    const sugestii = p.sugestii || [];
    return `<div class="linie-card">
      <p class="linie-denumire">${esc(p.firma)}</p>
      <div class="linie-meta">
        <span>${p.pret != null ? banii(p.pret) + ' ' + esc(p.moneda) : '—'}${p.durata ? ' · ' + esc(p.durata) : ''}</span>
      </div>
      <p class="sub" style="margin:4px 0 0">${p.creatLa ? new Date(p.creatLa).toLocaleDateString('ro-RO') : ''}${p.validatDe ? ' · ales de ' + esc(p.validatDe) : ''}</p>
      ${sugestii.length ? `
        <p class="sub" style="margin:8px 0 0">Sugestie automată — ${esc(p.firma)} a mai fost legată de codul acesta:</p>
        ${sugestii.map((c) => randCandidatFurnizor(c, index)).join('')}
      ` : ''}
      <div class="cauta-w">
        <input placeholder="Caută codul din nomenclator la care se aplică..." onkeydown="if(event.key==='Enter') window.__cautaPentruFurnizor(${index}, this.value)">
        <button class="btn" onclick="window.__cautaPentruFurnizor(${index}, this.previousElementSibling.value)">Aplică la un cod</button>
      </div>
      <div id="rezultate-cauta-furnizor-${index}"></div>
    </div>`;
  }

  const tabbar = `<div class="cauta-w">
    <button class="filtru ${ADMIN_TAB==='modele'?'activ':''}" onclick="window.__setAdminTab('modele')">Modele AI</button>
    <button class="filtru ${ADMIN_TAB==='preturi-furnizori'?'activ':''}" onclick="window.__setAdminTab('preturi-furnizori')">Prețuri furnizori</button>
  </div>`;

  const continutModele = `
    <p class="sub">Alege ce model OpenRouter rulează fiecare task -- scrie ca să filtrezi, dintre toate cele ${catalog.length} disponibile. Fără suprascriere, rămâne implicitul din .env. Se aplică la următorul apel, fără restart.</p>
    ${roluri.map(randRol).join('')}`;

  const continutPreturiFurnizori = preturiFurnizori.length
    ? `<p class="sub">Prețuri câștigătoare din căutările recente de furnizori (recrutare-bot) -- nu sunt legate automat de un material anume din devize, dar poți lega manual un preț la un cod. ${preturiFurnizori.length} intrări.</p>
       ${preturiFurnizori.map((p, i) => randPretFurnizor(p, i)).join('')}`
    : `<p class="sub">Nicio ofertă câștigătoare înregistrată încă în recrutare-bot.</p>`;

  app(antet('setari') + `
    <main style="max-width:720px">
      <h1>Administrare</h1>
      ${tabbar}
      ${ADMIN_TAB === 'modele' ? continutModele : continutPreturiFurnizori}
    </main>`);

  window.__setAdminTab = (tab) => { ADMIN_TAB = tab; paginaSetari(); };

  window.__cautaPentruFurnizor = async (index, text) => {
    const container = document.getElementById(`rezultate-cauta-furnizor-${index}`);
    if (!text || !text.trim()) { container.innerHTML = ''; return; }
    container.innerHTML = '<p style="font-size:12px;color:var(--sters);margin:8px 0">Se caută...</p>';
    try {
      const rezultate = await api(`/api/cauta?q=${encodeURIComponent(text)}`);
      container.innerHTML = rezultate.length
        ? rezultate.map((c) => randCandidatFurnizor(c, index)).join('')
        : '<p style="font-size:12px;color:var(--sters);margin:8px 0">Niciun rezultat.</p>';
    } catch (e) { container.innerHTML = `<p style="font-size:12px;color:var(--nu)">${esc(e.message)}</p>`; }
  };

  window.__aplicaLaCod = async (index, colectie, cod) => {
    const p = preturiFurnizori[index];
    if (!p) return;
    try {
      await api('/api/preturi-castigatoare/aplica', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ colectie, cod, pret: p.pret, moneda: p.moneda, firma: p.firma }),
      });
      alert(`Preț aplicat la ${colectie} / ${cod}.`);
      paginaSetari();
    } catch (e) { alert(e.message); }
  };

  if (ADMIN_TAB !== 'modele') return;

  // ─── Combo box cautabil (vezi CSS .model-combo) ───────────────────────────
  // Motiv: <datalist> nativ arata doar un numar limitat de sugestii cand
  // campul e gol -- verificat live, 436 modele in DOM, doar o mana vizibile.
  // Filtrare pe id SAU nume, primele 60 fara text (destul cat sa se vada ce
  // exista, fara sa randeze toate 436 odata), pana la 200 cu text scris.
  function filtreazaModele(text) {
    const t = text.trim().toLowerCase();
    if (!t) return catalog.slice(0, 60);
    return catalog.filter((m) => m.id.toLowerCase().includes(t) || (m.nume || '').toLowerCase().includes(t)).slice(0, 200);
  }

  // La FOCUS (primul click, camp inca precompletat cu modelul curent), lista
  // trebuie sa arate CATALOGUL INTREG, nu una filtrata dupa valoarea deja
  // scrisa -- altfel omul vede doar 1-2 potriviri intamplatoare cu propriul
  // model curent si crede ca dropdown-ul "nu arata toate modelele", desi
  // datele erau complete. Raportat direct, cu captura: la focus pe un camp
  // cu "claude-sonnet-5" deja scris, aparea doar "claude-sonnet-5" si
  // "claude-sonnet-5:batch" -- tehnic corect ca filtrare, gresit ca prima
  // impresie. La SCRIS (oninput), filtrarea normala ramane, e ceea ce omul
  // chiar cauta in momentul ala.
  function arataLista(input, ignoraValoarea) {
    const rol = input.dataset.rol;
    const lista = document.querySelector(`.model-lista[data-rol="${rol}"]`);
    const rezultate = ignoraValoarea ? catalog.slice(0, 60) : filtreazaModele(input.value);
    lista.innerHTML = rezultate.length
      ? rezultate.map((m) => `<div class="model-optiune" data-id="${esc(m.id)}">
          <span class="m-id">${esc(m.id)}</span><span class="m-nume">${esc(m.nume)}${m.structurat ? '' : ' ⚠ fără JSON strict'}</span>
        </div>`).join('')
      : '<div class="gol">Niciun model potrivit.</div>';
    lista.hidden = false;
    lista.querySelectorAll('.model-optiune').forEach((opt) => {
      // mousedown (nu click) cu preventDefault -- fereste blur-ul campului
      // inainte sa apuce sa inchida lista, altfel click-ul n-ar mai ajunge.
      opt.onmousedown = (e) => {
        e.preventDefault();
        input.value = opt.dataset.id;
        lista.hidden = true;
      };
    });
  }

  document.querySelectorAll('.model-combo input').forEach((input) => {
    input.oninput = () => arataLista(input, false);
    input.onfocus = () => arataLista(input, true);
  });
  // Un singur listener global -- inchide orice lista deschisa la click in
  // afara ei (combo-ul curent isi gestioneaza singur inchiderea prin
  // onmousedown+preventDefault de mai sus, deci nu se bat unul pe altul).
  document.addEventListener('mousedown', (e) => {
    if (e.target.closest('.model-combo')) return;
    document.querySelectorAll('.model-lista').forEach((l) => { l.hidden = true; });
  });

  document.querySelectorAll('.btn-salveaza').forEach((btn) => {
    btn.onclick = async () => {
      const rol = btn.dataset.rol;
      const input = document.querySelector(`input[data-rol="${rol}"]`);
      try {
        await api('/api/setari-model', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ rol, modelSlug: input.value }) });
        paginaSetari();
      } catch (e) { alert(e.message); }
    };
  });
  document.querySelectorAll('.btn-implicit').forEach((btn) => {
    btn.onclick = async () => {
      try {
        await api('/api/setari-model', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ rol: btn.dataset.rol, modelSlug: '' }) });
        paginaSetari();
      } catch (e) { alert(e.message); }
    };
  });
}

function eroareGenerala(e) {
  app(antet('proiecte') + `<main><div class="eroare-banda">${esc(e.message)}</div><button class="btn" onclick="navigheaza('/')">Înapoi la proiecte</button></main>`);
}

// ─── Router ──────────────────────────────────────────────────────────────────
function redeseneaza() {
  const seg = segmenteRuta();
  if (seg[0] === 'nou') return paginaProiectNou();
  if (seg[0] === 'setari') return paginaSetari();
  if (seg[0] === 'proiect' && seg[1]) {
    const id = Number(seg[1]);
    const tab = seg[2] || 'revizuire';
    if (tab === 'preturi') return paginaPreturi(id);
    if (tab === 'deviz') return paginaDeviz(id);
    if (tab === 'completitudine') return paginaCompletitudine(id);
    if (tab === 'executie') return paginaExecutie(id);
    if (tab === 'istoric') return paginaIstoric(id);
    if (tab === 'cantitati') return paginaCantitati(id);
    return paginaRevizuire(id);
  }
  return paginaProiecte();
}

redeseneaza();
</script>
